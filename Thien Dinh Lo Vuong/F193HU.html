
<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu lạc bộ Tin học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Câu lạc bộ Tin học</h1>
    <p class="tieu-de-muc">Các bước tham gia hoạt động:</p>

    <ol>
        <li>Xem lịch</li>
        <li>Điền đăng ký</li>
        <li>Tham dự</li>
    </ol>

    <img src="images/clb.jpg" alt="Học lập trình">

    <table>
        <caption>Lịch sinh hoạt</caption>
        <tr>
            <th>Buổi</th>
            <th>Nội dung</th>
        </tr>
        <tr>
            <td>Thứ 2</td>
            <td>HTML</td>
        </tr>
        <tr>
            <td>Thứ 4</td>
            <td>CSS</td>
        </tr>
    </table>

    <form action="#" method="get">
        <label for="hoten">Họ tên:</label>
        <input type="text" id="hoten" name="hoten" required>
        <button type="submit">Đăng ký</button>
    </form>
</body>
</html>
