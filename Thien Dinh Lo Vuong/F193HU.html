
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Câu lạc bộ Tin học</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Câu lạc bộ Tin học</h1>

    <p class="tieu-de-muc">
        Các bước tham gia câu lạc bộ:
    </p>

    <ol>
        <li>Xem lịch</li>
        <li>Điền đăng ký</li>
        <li>Tham dự</li>
    </ol>

    <h2>Lịch sinh hoạt</h2>

    <table>
        <tr>
            <th>Buổi</th>
            <th>Nội dung</th>
        </tr>
        <tr>
            <td>Thứ 2</td>
            <td>HTML</td>
        </tr>
        <tr>
            <td>Thứ 4</td>
            <td>CSS</td>
        </tr>
    </table>

    <h2>Hình ảnh hoạt động</h2>

    <img src="images/clb.jpg" alt="Học lập trình">

    <h2>Đăng ký tham gia</h2>

    <form action="#" method="get">
        <label for="hoten">Họ tên:</label>
        <input type="text" id="hoten"
               name="hoten" required>

        <button type="submit">Đăng ký</button>
    </form>

</body>
</html>
